<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>LVL ESSENCE</title>

    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>

<header class="site-header">
    <div class="topbar">
        <a class="admin-link" href="/admin/inicioAdmin">
            Acceso a administracion
        </a>
    </div>

    <div class="main-nav">
        <a class="brand" href="#" id="inicio">LVL ESSENCE</a>

        <nav aria-label="Navegacion principal" class="nav-links">
            <a href="#" id="perfumes">PERFUMES</a>
            <a href="#" id="registrarme">REGISTRARME</a>
            <a href="#" id="identificarme">IDENTIFICARME</a>
            <a href="#" id="carrito">CARRITO</a>
            <a href="#" id="pedidos">VER MIS PEDIDOS</a>
            <a href="#" id="mis_datos">MIS DATOS</a>
            <a href="#" id="cerrar_sesion">CERRAR SESION</a>
        </nav>
    </div>
</header>

<main class="page-shell">
    <div id="contenedor"></div>
</main>

<script src="/librerias_js/jquery.js"></script>
<script src="/librerias_js/mustache.js"></script>

<script>
    // =====================================================
    // PLANTILLAS HTML
    // =====================================================

    let plantilla_inicio;
    let plantilla_productos;
    let plantilla_detalles_producto;
    let plantilla_registro_usuario;
    let plantilla_identificar_usuario;

    $.get("/plantillas_html/inicio.html")
        .done(function (res) {
            plantilla_inicio = res;
        });

    $.get("/plantillas_html/listado_productos.html")
        .done(function (res) {
            plantilla_productos = res;
        });

    $.get("/plantillas_html/detalles_producto.html")
        .done(function (res) {
            plantilla_detalles_producto = res;
        });

    $.get("/plantillas_html/registro_usuario.html")
        .done(function (res) {
            plantilla_registro_usuario = res;
        });

    $.get("/plantillas_html/identificar_usuario.html")
        .done(function (res) {
            plantilla_identificar_usuario = res;
        });


    // =====================================================
    // INICIO Y PERFUMES
    // =====================================================

    $("#inicio").click(function (e) {
        e.preventDefault();
        $("#contenedor").html(plantilla_inicio);
    });

    $("#perfumes").click(function (e) {
        e.preventDefault();
        mostrar_perfumes();
    });

    function mostrar_perfumes() {
        $.getJSON("/restPerfumes/listar")
            .done(function (json) {
                let resultado = Mustache.render(
                    plantilla_productos, json
                );
                $("#contenedor").html(resultado);
            })
            .fail(function (xhr) {
                console.error("Error listando perfumes", xhr);
            });
    }

    function mostrar_detalles(id) {
        $.getJSON("/restPerfumes/obtener_perfume", {id: id})
            .done(function (json) {
                let resultado = Mustache.render(
                    plantilla_detalles_producto, json
                );
                $("#contenedor").html(resultado);
            })
            .fail(function (xhr) {
                console.error("Error obteniendo detalles", xhr);
            });
    }


    // =====================================================
    // REGISTRO PÚBLICO
    // =====================================================

    $("#registrarme").click(function (e) {
        e.preventDefault();
        $("#contenedor").html(plantilla_registro_usuario);
    });

    $(document).on("submit", "#form_registro_usuario", function (e) {
        e.preventDefault();

        let formulario = this;
        let formData = new FormData(formulario);

        $.ajax({
            url: "/restUsuarios/registrarUsuario",
            type: "POST",
            data: formData,
            processData: false,
            contentType: false
        })
            .done(function (respuesta) {
                $("#mensaje_registro").text(respuesta);
                formulario.reset();
            })
            .fail(function (xhr) {
                console.error(xhr);
                $("#mensaje_registro").text(
                    "Ha ocurrido un error durante el registro."
                );
            });
    });


    // =====================================================
    // IDENTIFICACIÓN PÚBLICA
    // =====================================================

    $("#identificarme").click(function (e) {
        e.preventDefault();
        $("#contenedor").html(plantilla_identificar_usuario);
    });

    $(document).on("submit", "#form_identificar_usuario", function (e) {
        e.preventDefault();

        let formulario = this;
        let formData = new FormData(formulario);

        $.ajax({
            url: "/restUsuarios/identificarUsuario",
            type: "POST",
            data: formData,
            processData: false,
            contentType: false
        })
            .done(function (respuesta) {
                if (respuesta === "Te has identificado correctamente") {
                    $("#mensaje_identificacion").text(
                        "Bienvenido a LVL ESSENCE. Has iniciado sesión."
                    );
                    formulario.reset();
                } else {
                    $("#mensaje_identificacion").text(
                        "Credenciales incorrectas."
                    );
                }
            })
            .fail(function (xhr) {
                console.error(xhr);
                $("#mensaje_identificacion").text(
                    "Error de conexión durante la identificación."
                );
            });
    });


    // =====================================================
    // AÑADIR PERFUMES AL CARRITO
    // =====================================================

    function agregarProductoCarrito(idPerfume) {

        let input = document.getElementById(
            "cantidad_" + idPerfume
        );

        let cantidad = input ? Number(input.value) : 1;

        if (!Number.isInteger(cantidad) || cantidad < 1) {
            alert("Debes indicar una cantidad válida.");
            return;
        }

        $.post("/restCarrito/agregarProducto", {
            id: idPerfume,
            cantidad: cantidad
        })
            .done(function (respuesta) {
                alert(respuesta);
            })
            .fail(function (xhr) {
                if (xhr.status === 401) {
                    alert("Debes identificarte antes de comprar.");
                } else {
                    alert("No se pudo añadir el perfume.");
                    console.error(xhr);
                }
            });
    }


    // =====================================================
    // MOSTRAR EL CARRITO
    // =====================================================

    $("#carrito").click(function (e) {
        e.preventDefault();
        mostrarCarrito();
    });

    function mostrarCarrito() {

        $.getJSON("/restCarrito/obtenerProductos")
            .done(function (productos) {

                let total = productos.reduce(function (suma, p) {
                    return suma + Number(p.subtotal);
                }, 0);

                $.get("/plantillas_html/carrito.html")
                    .done(function (plantilla) {

                        let resultado = Mustache.render(
                            plantilla,
                            {
                                productos: productos,
                                total: total.toFixed(2),
                                tieneProductos: productos.length > 0
                            }
                        );

                        $("#contenedor").html(resultado);
                    })
                    .fail(function (xhr) {
                        console.error("Error cargando carrito.html", xhr);
                    });
            })
            .fail(function (xhr) {
                if (xhr.status === 401) {
                    alert("Debes identificarte para ver tu carrito.");
                } else {
                    console.error("Error obteniendo carrito", xhr);
                }
            });
    }


    // =====================================================
    // BORRAR UN PERFUME DEL CARRITO
    // =====================================================

    $(document).on("click", ".borrar-carrito", function (e) {
        e.preventDefault();

        let idPerfume = $(this).data("id");

        if (!confirm("¿Eliminar este perfume del carrito?")) {
            return;
        }

        $.post("/restCarrito/borrarProducto", {
            id: idPerfume
        })
            .done(function () {
                mostrarCarrito();
            })
            .fail(function (xhr) {
                alert("No se pudo eliminar el perfume.");
                console.error(xhr);
            });
    });


    // =====================================================
    // MODIFICAR CANTIDAD
    // =====================================================

    $(document).on("change", ".cantidad-carrito", function () {

        let idPerfume = $(this).data("id");
        let cantidad = Number($(this).val());

        if (!Number.isInteger(cantidad) || cantidad < 1) {
            alert("La cantidad mínima es 1.");
            mostrarCarrito();
            return;
        }

        $.post("/restCarrito/cambiarCantidad", {
            id: idPerfume,
            cantidad: cantidad
        })
            .done(function () {
                mostrarCarrito();
            })
            .fail(function (xhr) {
                alert("No se pudo modificar la cantidad.");
                console.error(xhr);
                mostrarCarrito();
            });
    });

    // ================================================
    // PASO 1 - DATOS DE ENVÍO
    // ================================================


    $(document).on("submit", "#form_check_out_1", function (e) {

        e.preventDefault();

        let datosFormulario = $(this).serialize();

        console.log("Datos enviados:", datosFormulario);

        $.post("/restPedido/procesarPaso1", datosFormulario)

            .done(function (respuesta) {

                if (respuesta === "ok") {

                    $.get("/plantillas_html/check_out_2.html")
                        .done(function (plantilla) {
                            $("#contenedor").html(plantilla);
                        });

                } else {

                    $("#mensaje_checkout_1").text(
                        "No se pudieron guardar los datos."
                    );
                }

            })

            .fail(function (xhr) {

                console.error("Error paso 1:", xhr);

                $("#mensaje_checkout_1").text(
                    "Revisa los datos introducidos."
                );

            });

    });


    // ================================================
    // PASO 2 - PAGO SIMULADO
    // ================================================

    $(document).on("submit", "#form_check_out_2", function (e) {

        e.preventDefault();

        $.post(
            "/restPedido/procesarPaso2",
            $(this).serialize()
        )
            .done(function (respuesta) {

                if (respuesta !== "ok") {
                    $("#mensaje_checkout_2").text(
                        "No se pudieron guardar los datos."
                    );
                    return;
                }

                $.get("/plantillas_html/check_out_3.html")
                    .done(function (plantilla) {
                        $("#contenedor").html(plantilla);
                    })
                    .fail(function () {
                        $("#mensaje_checkout_2").text(
                            "No se pudo cargar el paso 3."
                        );
                    });

            })
            .fail(function (xhr) {
                mostrarErrorCheckout(xhr, "#mensaje_checkout_2");
            });
    });


    // ================================================
    // PASO 3 - ENVOLTORIO DE REGALO
    // ================================================

    $(document).on("submit", "#form_check_out_3", function (e) {

        e.preventDefault();

        $.post(
            "/restPedido/procesarPaso3",
            $(this).serialize()
        )
            .done(function (resumen) {

                if (!resumen.perfumes ||
                    resumen.perfumes.length === 0) {

                    $("#mensaje_checkout_3").text(
                        "El carrito está vacío."
                    );
                    return;
                }

                $.get("/plantillas_html/check_out_4.html")
                    .done(function (plantilla) {

                        let html = Mustache.render(
                            plantilla,
                            resumen
                        );

                        $("#contenedor").html(html);
                    })
                    .fail(function () {
                        $("#mensaje_checkout_3").text(
                            "No se pudo cargar el resumen."
                        );
                    });

            })
            .fail(function (xhr) {
                mostrarErrorCheckout(xhr, "#mensaje_checkout_3");
            });
    });


    // ================================================
    // PASO 4 - CONFIRMACIÓN DEL PEDIDO
    // ================================================

    $(document).on("click", "#boton_confirmar_pedido", function (e) {

        e.preventDefault();

        let boton = $(this);
        boton.prop("disabled", true);

        $.post("/restPedido/procesarPaso4")
            .done(function (respuesta) {

                if (respuesta === "ok") {

                    $("#contenedor").html(
                        '<section class="auth-section">' +
                        '<div class="auth-card">' +
                        '<h1>¡Pedido confirmado!</h1>' +
                        '<p>Tu compra de prueba se ha registrado.</p>' +
                        '<p>Gracias por elegir LVL ESSENCE.</p>' +
                        '</div>' +
                        '</section>'
                    );

                } else {
                    $("#mensaje_checkout_4").text(
                        "No se pudo confirmar el pedido."
                    );

                    boton.prop("disabled", false);
                }
            })
            .fail(function (xhr) {

                mostrarErrorCheckout(xhr, "#mensaje_checkout_4");

                boton.prop("disabled", false);
            });
    });


    $(document).on("click", "#realizar_pedido", function (e) {

        e.preventDefault();

        console.log("Botón REALIZAR PEDIDO pulsado");

        $.getJSON("/restCarrito/obtenerProductos")

            .done(function (productos) {

                if (productos.length === 0) {
                    alert("Tu carrito está vacío.");
                    return;
                }

                $.get("/plantillas_html/check_out_1.html")

                    .done(function (plantilla) {
                        $("#contenedor").html(plantilla);
                    })

                    .fail(function () {
                        alert("Error al cargar el paso 1.");
                    });
            })

            .fail(function (xhr) {
                console.error("Error del carrito:", xhr);
                alert("No se pudo acceder al checkout.");
            });

    });

</script>
</body>
</html>
