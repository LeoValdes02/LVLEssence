<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso administrador - LVL ESSENCE</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body class="admin-page">

<main class="auth-section">

    <div class="auth-card">

        <div class="section-heading">
            <a class="brand" href="/" aria-label="LVL ESSENCE, ir al inicio">LVL ESSENCE</a>
            <h1>Acceso administrativo</h1>
            <p>Introduce la contraseña de administración.</p>
        </div>

        <form method="post"
              th:action="@{/loginAdmin}">

            <div class="form-group">
                <label for="passwordAdmin">Contraseña</label>

                <input
                        type="password"
                        id="passwordAdmin"
                        name="pass-login-admin"
                        autocomplete="current-password"
                        required>
            </div>

            <p th:if="${param.error != null}"
               role="alert">
                Contraseña incorrecta.
            </p>

            <button type="submit" class="btn btn-primary">
                Entrar en administración
            </button>

        </form>

    </div>

</main>

</body>
</html>
