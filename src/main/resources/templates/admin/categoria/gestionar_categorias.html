<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar categorias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="admin-page">

<div th:insert="fragments/general.html :: menu"></div>

<main class="admin-shell">
    <section class="section-heading admin-heading">
        <div>
            <p class="eyebrow">Catalogo</p>
            <h1>Gestionar categorias</h1>
            <p>Listado de categorias disponibles para revisar, editar o eliminar.</p>
        </div>
        <a class="btn btn-primary" href="/admin/registrarCategoria">Nueva categoria</a>
    </section>

    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <section class="admin-product-grid">
        <article class="admin-product-card" th:each="c : ${categorias}">
            <div class="admin-product-info">
                <h2 th:text="${c.nombre}"></h2>

                <dl class="product-details">
                    <div class="full-detail">
                        <dt>Descripcion</dt>
                        <dd th:text="${c.descripcion}"></dd>
                    </div>
                </dl>

                <form method="post" th:action="@{/admin/borrarCategoria}" data-confirmar="¿Eliminar esta categoría?" onsubmit="return window.LVLFeedback ? true : confirm('¿Eliminar esta categoría?')"><input type="hidden" name="id" th:value="${c.id}"><button class="btn btn-danger" type="submit">Borrar</button></form>
                <br>
                <a class="btn btn-danger" th:href="@{/admin/editarCategoria(id=${c.id})}">Editar</a>
                <br>

            </div>
        </article>
    </section>
</main>

</body>
</html>
