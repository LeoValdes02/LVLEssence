<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar categoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="admin-page">

<div th:insert="fragments/general.html :: menu"></div>

<main class="admin-shell">
    <section class="form-card">
        <div class="section-heading">
            <p class="eyebrow">Administracion</p>
            <h1>Editar categoria</h1>
            <p>Introduce los datos de la categoria para editarla.</p>
        </div>

        <form class="luxury-form" action="#" th:action="@{/admin/guardaCambiosCategoria}" th:object="${categoriaEditar}" method="post">
            <div class="form-field">
                <label for="nombre">Nombre</label>
                <input type="text" th:field="*{nombre}">
                <span class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </div>

            <div class="form-field">
                <label for="descripcion">Descripcion</label>
                <input type="text" th:field="*{descripcion}">
                <span class="field-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
            </div>
            <br>
            <input type="hidden" th:field="*{id}">
            <button class="btn btn-primary form-submit" type="submit">Editar</button>
        </form>
    </section>
</main>

</body>
</html>
