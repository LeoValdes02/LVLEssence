<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar usuarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="admin-page">

<div th:insert="fragments/general.html :: menu"></div>

<main class="admin-shell">
    <section class="section-heading admin-heading">
        <div>
            <p class="eyebrow">Administracion</p>
            <h1>Gestionar usuarios</h1>
            <p>Listado de usuarios disponibles para revisar, editar o eliminar.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/registrarUsuario}">Nuevo usuario</a>
    </section>

    <p th:if="${error}" th:text="${error}" role="alert"
       style="color: #ff6464;"></p>

    <p th:if="${mensaje}" th:text="${mensaje}"
       role="status"></p>

    <section class="admin-product-grid">
        <article class="admin-product-card" th:each="u : ${usuarios}">
            <div class="admin-product-info">
                <h2 th:text="${u.nombre + ' ' + u.apellidos}"></h2>

                <dl class="product-details">
                    <div class="full-detail">
                        <dt>Email</dt>
                        <dd th:text="${u.email}"></dd>
                    </div>
                    <div class="full-detail">
                        <dt>Telefono</dt>
                        <dd th:text="${u.telefono}"></dd>
                    </div>
                </dl>


                <form th:action="@{/admin/borrarUsuario}"
                      method="post"
                      data-confirmar="¿Seguro que quieres borrar este usuario?" onsubmit="return window.LVLFeedback ? true : confirm('¿Seguro que quieres borrar este usuario?')">

                    <input type="hidden" name="id" th:value="${u.id}">

                    <button type="submit" class="btn btn-danger">
                        Borrar
                    </button>
                </form>
                <br>
                <a class="btn btn-secondary" th:href="@{/admin/editarUsuario(id=${u.id})}">Editar</a>
                <br>
            </div>
        </article>
    </section>
</main>

</body>
</html>
