<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administración</title>
</head>

<body>

<div th:fragment="menu" class="admin-header">

    <div class="admin-topbar">
        <a class="admin-link" th:href="@{/}">
            Volver a la parte pública
        </a>
    </div>

    <nav class="admin-nav"
         aria-label="Navegación de administración">

        <a th:href="@{/admin/gestionarPerfumes}">
            Gestionar perfumes
        </a>

        <a th:href="@{/admin/gestionarUsuarios}">
            Gestionar usuarios
        </a>

        <a th:href="@{/admin/gestionarCategorias}">
            Gestionar categorías
        </a>

        <a th:href="@{/admin/gestionarPedidos}">
            Gestionar pedidos
        </a>
        <form method="post" th:action="@{/admin/cerrarSesion}">
            <button type="submit" class="btn btn-secondary">
                Cerrar sesión
            </button>
        </form>

    </nav>

</div>

</body>
</html>
