<section class="auth-section acceso-premium" aria-labelledby="acceso-titulo">
 <div class="acceso-panel glass-panel">
  <div class="acceso-formulario">
   <a href="#inicio" data-ruta="inicio" class="acceso-marca">LVL ESSENCE</a>
   <h1 id="acceso-titulo" tabindex="-1">Crear cuenta</h1><p>Introduce tus datos para registrarte en la tienda.</p>
   <p class="acceso-obligatorio">Todos los campos son obligatorios.</p>
   <form id="form_registro_usuario">
    <div class="form-group"><label for="nombre">Nombre</label><input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="given-name" required></div>
    <div class="form-group"><label for="apellidos">Apellidos</label><input type="text" id="apellidos" name="apellidos" placeholder="Tus apellidos" autocomplete="family-name" required></div>
    <div class="form-group"><label for="email">Correo electrónico</label><input type="email" id="email" name="email" placeholder="correo@ejemplo.com" autocomplete="email" required></div>
    <div class="form-group"><label for="pass">Contraseña</label><div class="acceso-password"><input type="password" id="pass" name="pass" autocomplete="new-password" required><button type="button" class="acceso-ver-password" aria-controls="pass" aria-pressed="false">Mostrar contraseña</button></div></div>
    <div class="form-group"><label for="telefono">Teléfono</label><input type="tel" id="telefono" name="telefono" placeholder="600 000 000" autocomplete="tel" required></div>
    <p id="mensaje_registro" class="acceso-mensaje" role="status" aria-live="polite"></p>
    <button type="submit" class="btn btn-primary acceso-enviar">Registrarme</button>
   </form>
   <p class="acceso-alternar">¿Ya tienes cuenta? <a href="#identificarme" data-ruta="identificarme">Iniciar sesión</a></p>
  </div>
  <aside class="acceso-visual" aria-hidden="true"><div class="acceso-halo"></div><img src="/imagenes_productos_iniciales/Sauvage.webp" alt="" width="500" height="500"><p>LVL ESSENCE</p><span>Una experiencia de perfumería selecta.</span></aside>
 </div>
</section>
