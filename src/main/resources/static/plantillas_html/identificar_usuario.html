<section class="auth-section">
    <div class="auth-card">

        <div class="section-heading">
            <p class="eyebrow">Mi cuenta</p>
            <h1>Iniciar sesión</h1>
            <p>Accede a tu cuenta de LVL ESSENCE.</p>
        </div>

        <form id="form_identificar_usuario">

            <!-- EMAIL -->
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required
                >
            </div>
            <br>

            <input type="password" id="pass" name="pass" required, autocomplete="current-password" placeholder="Contraseña">


            <div id="mensaje_identificacion"></div>
            <br>

            <button type="submit" class="btn btn-primary">
                Iniciar sesión
            </button>

        </form>

    </div>
</section>
