
<section class="auth-section">
    <div class="auth-card">

        <div class="section-heading">
            <p class="eyebrow">{{MARCA}}</p>
            <h1>{{NOMBRE}}</h1>
            <p>{{CATEGORIA}}</p>
        </div>

        <img
                class="imagen-producto"
                src="/mostrar_imagen?id={{ID}}"
                alt="{{NOMBRE}}">

        <p data-no-traducir>{{DESCRIPCION}}</p>
        <div id="detalle_precio_actual" data-id="{{ID}}">
            <div id="detalle_precio_original" class="precio-anterior"
                 {{^TIENE_DESCUENTO}}hidden{{/TIENE_DESCUENTO}}>
                <s><span id="detalle_importe_original">{{PRECIO_ORIGINAL}}</span> EUR</s>
                <span id="detalle_porciento" class="oferta-insignia">-{{DESCUENTO_PORCENTAJE}}%</span>
            </div>
            <p class="product-price"><span id="detalle_importe_final">{{PRECIO}}</span> EUR</p>
        </div>

        <div class="form-group">
            <label for="cantidad_{{ID}}">Cantidad</label>

            <input
                    class="quantity-input"
                    type="number"
                    id="cantidad_{{ID}}"
                    min="1"
                    step="1"
                    value="1">
        </div>

        <button
                class="btn btn-primary"
                type="button"
                onclick="agregarProductoCarrito({{ID}})">
            Agregar al carrito
        </button>
    </div>
</section>
