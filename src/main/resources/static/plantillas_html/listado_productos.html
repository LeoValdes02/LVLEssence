{{#.}}
<!--
    Con {{#.}} ... {{/.}} indicamos a Mustache.js que el HTML
    de dentro se aplicara a CADA elemento del array que le pasemos.
-->

<article class="product-card">
    <div class="product-media">
        <img
                class="imagen-producto"
                src="/mostrar_imagen?id={{ID}}"
                alt="{{NOMBRE}}">
    </div>

    <div class="product-info">
        <p class="product-brand">{{MARCA}}</p>
        <h2 class="product-name">{{NOMBRE}}</h2>
        <p class="product-meta">{{CATEGORIA}}</p>
        <p class="product-price">{{PRECIO}} EUR</p>

        <div class="product-actions">
            <a href="#"
               class="btn btn-secondary"
               onclick="mostrar_detalles({{ID}}); return false;">
                Ver detalles
            </a>

            <input
                    class="quantity-input"
                    id="cantidad_{{ID}}"
                    type="number"
                    min="1"
                    step="1"
                    value="1">

            <button
                    class="btn btn-primary"
                    type="button"
                    onclick="agregarProductoCarrito({{ID}})">
                Agregar al carrito
            </button>
        </div>
    </div>
</article>
