<section class="catalogo-layout" id="catalogo_inicio" aria-label="Catálogo de perfumes">
    <div class="catalogo-encabezado">
        <p class="eyebrow">LVL ESSENCE · Nuestra selección</p>
        <h1>Explora nuestros perfumes</h1>
        <p class="catalogo-subtitulo">Encuentra tu fragancia por nombre, categoría o precio.</p>
    </div>

    <form id="form_filtros_catalogo" class="catalogo-filtros" aria-label="Buscar y filtrar perfumes">
        <div class="catalogo-campo catalogo-buscador">
            <label for="filtro_texto">Buscar perfume</label>
            <input type="search" id="filtro_texto" name="texto"
                   placeholder="Ej.: Sauvage, Invictus..." autocomplete="off">
        </div>
        <div class="catalogo-campo">
            <label for="filtro_categoria">Categoría</label>
            <select id="filtro_categoria" name="categoriaId">
                <option value="">Todas</option>
            </select>
            <small id="catalogo_ayuda_categorias" class="catalogo-ayuda" role="status"></small>
        </div>
        <div class="catalogo-campo">
            <label for="filtro_precio_min">Precio mín. (€)</label>
            <input type="number" id="filtro_precio_min" name="precioMin"
                   min="0" step="0.01" placeholder="0,00">
        </div>
        <div class="catalogo-campo">
            <label for="filtro_precio_max">Precio máx. (€)</label>
            <input type="number" id="filtro_precio_max" name="precioMax"
                   min="0" step="0.01" placeholder="Sin límite">
        </div>
        <div class="catalogo-campo">
            <label for="filtro_orden">Ordenar por</label>
            <select id="filtro_orden" name="orden">
                <option value="nombreAsc">Nombre: A-Z</option>
                <option value="nombreDesc">Nombre: Z-A</option>
                <option value="precioAsc">Precio: menor a mayor</option>
                <option value="precioDesc">Precio: mayor a menor</option>
                <option value="recientes">Más recientes</option>
            </select>
        </div>
        <div class="catalogo-filtro-acciones">
            <button class="btn btn-primary" type="submit">Aplicar filtros</button>
            <button class="btn btn-secondary" type="button" id="limpiar_filtros_catalogo">Limpiar</button>
        </div>
    </form>

    <div class="catalogo-estado">
        <p id="catalogo_total" aria-live="polite">Cargando perfumes...</p>
        <span>10 perfumes por página</span>
    </div>
    <p id="mensaje_filtros_catalogo" class="catalogo-mensaje-error" role="alert"></p>
    <div id="catalogo_resultados" class="catalogo-resultados" aria-label="Perfumes encontrados"></div>
    <nav id="catalogo_paginacion" class="catalogo-paginacion" aria-label="Páginas del catálogo"></nav>
</section>
